services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
      - /app/.venv
      - /app/__pycache__
    environment:
      - APP_ENV=development
    env_file:
      - .env
    restart: always

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/.next
      - /app/node_modules
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    env_file:
      - .env
    depends_on:
      - api
    restart: always
