[project]
name = "detour-api"
version = "0.1.0"
description = "Detour backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "email-validator>=2.2,<3",
  "argon2-cffi>=23.1,<24",
  "httpx>=0.27,<1",
  "h3>=4.5.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "ruff>=0.12,<1",
]
